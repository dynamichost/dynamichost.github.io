<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>IP API Gateway</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; font-family: system-ui, sans-serif; background: #111827;
      color: #e5e7eb;
    }
    main { max-width: 1050px; margin: 0 auto; padding: 28px 18px 60px; }
    h1 { margin-top: 0; }
    .card {
      background: #1f2937; border: 1px solid #374151; border-radius: 12px;
      padding: 18px; margin: 16px 0;
    }
    input, button {
      box-sizing: border-box; border-radius: 7px; border: 1px solid #4b5563;
      padding: 10px 12px; font-size: 15px;
    }
    input { background: #111827; color: #fff; }
    button { background: #2563eb; color: #fff; cursor: pointer; }
    button.delete { background: #dc2626; }
    button:hover { opacity: .9; }
    form { display: flex; gap: 8px; flex-wrap: wrap; }
    .key { width: min(100%, 520px); }
    .ip { min-width: 230px; flex: 1; }
    .port { width: 130px; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { text-align: left; padding: 9px; border-bottom: 1px solid #374151; }
    .status { min-height: 24px; margin: 12px 0; }
    .ok { color: #86efac; }
    .error { color: #fca5a5; }
    .muted { color: #9ca3af; }
    code { background: #111827; padding: 2px 5px; border-radius: 4px; }
  </style>
</head>
<body>
<main>
  <h1>IP API Gateway</h1>
  <p class="muted">Manage <code>iplist.json</code> and <code>iplist_with_port.json</code>.</p>

  <div class="card">
    <h2>API Key</h2>
    <input id="apiKey" class="key" type="password" placeholder="Enter API key">
    <button onclick="saveKey()">Save</button>
    <span id="keyStatus" class="muted"></span>
  </div>

  <div id="status" class="status"></div>

  <div class="card">
    <h2>IP List</h2>
    <form onsubmit="addIp(event)">
      <input id="ipInput" class="ip" placeholder="e.g. 192.0.2.10" required>
      <button type="submit">Add IP</button>
      <button type="button" onclick="loadAll()">Refresh</button>
    </form>
    <table>
      <thead><tr><th>IP</th><th>Action</th></tr></thead>
      <tbody id="ipsBody"></tbody>
    </table>
  </div>

  <div class="card">
    <h2>IP + Port List</h2>
    <form onsubmit="addIpPort(event)">
      <input id="ipPortInput" class="ip" placeholder="e.g. 192.0.2.10" required>
      <input id="portInput" class="port" type="number" min="1" max="65535" placeholder="Port" required>
      <button type="submit">Add Entry</button>
    </form>
    <table>
      <thead><tr><th>IP</th><th>Port</th><th>Action</th></tr></thead>
      <tbody id="ipPortsBody"></tbody>
    </table>
  </div>
</main>

<script>
  const keyField = document.getElementById("apiKey");
  keyField.value = sessionStorage.getItem("apiKey") || "";

  function saveKey() {
    sessionStorage.setItem("apiKey", keyField.value);
    document.getElementById("keyStatus").textContent = "Saved for this browser tab.";
  }

  function apiHeaders() {
    return {
      "Content-Type": "application/json",
      "X-API-Key": keyField.value
    };
  }

  function setStatus(message, ok = true) {
    const el = document.getElementById("status");
    el.textContent = message;
    el.className = "status " + (ok ? "ok" : "error");
  }

  async function request(url, options = {}) {
    const response = await fetch(url, options);
    let data = {};
    try { data = await response.json(); } catch {}
    if (!response.ok) {
      throw new Error(data.error || `HTTP ${response.status}`);
    }
    return data;
  }

  async function loadAll() {
    try {
      const [ips, entries] = await Promise.all([
        request("/api/ips"),
        request("/api/ips-with-port")
      ]);

      document.getElementById("ipsBody").innerHTML =
        ips.ips.map(ip => `
          <tr>
            <td><code>${escapeHtml(ip)}</code></td>
            <td><button class="delete" onclick="deleteIp('${encodeURIComponent(ip)}')">Remove</button></td>
          </tr>
        `).join("");

      document.getElementById("ipPortsBody").innerHTML =
        entries.entries.map(entry => `
          <tr>
            <td><code>${escapeHtml(entry.ip)}</code></td>
            <td>${entry.port}</td>
            <td><button class="delete" onclick="deleteIpPort('${encodeURIComponent(entry.ip)}', ${entry.port})">Remove</button></td>
          </tr>
        `).join("");

      setStatus(`Loaded ${ips.count} IPs and ${entries.count} IP/port entries.`);
    } catch (err) {
      setStatus(err.message, false);
    }
  }

  async function addIp(event) {
    event.preventDefault();
    const ip = document.getElementById("ipInput").value.trim();

    try {
      await request("/api/ips", {
        method: "POST",
        headers: apiHeaders(),
        body: JSON.stringify({ ip })
      });
      document.getElementById("ipInput").value = "";
      setStatus(`Added ${ip}.`);
      await loadAll();
    } catch (err) {
      setStatus(err.message, false);
    }
  }

  async function deleteIp(encodedIp) {
    const ip = decodeURIComponent(encodedIp);
    if (!confirm(`Remove ${ip}?`)) return;

    try {
      await request(`/api/ips/${encodedIp}`, {
        method: "DELETE",
        headers: apiHeaders()
      });
      setStatus(`Removed ${ip}.`);
      await loadAll();
    } catch (err) {
      setStatus(err.message, false);
    }
  }

  async function addIpPort(event) {
    event.preventDefault();
    const ip = document.getElementById("ipPortInput").value.trim();
    const port = Number(document.getElementById("portInput").value);

    try {
      await request("/api/ips-with-port", {
        method: "POST",
        headers: apiHeaders(),
        body: JSON.stringify({ ip, port })
      });
      document.getElementById("ipPortInput").value = "";
      document.getElementById("portInput").value = "";
      setStatus(`Added ${ip}:${port}.`);
      await loadAll();
    } catch (err) {
      setStatus(err.message, false);
    }
  }

  async function deleteIpPort(encodedIp, port) {
    const ip = decodeURIComponent(encodedIp);
    if (!confirm(`Remove ${ip}:${port}?`)) return;

    try {
      await request(`/api/ips-with-port/${encodedIp}/${port}`, {
        method: "DELETE",
        headers: apiHeaders()
      });
      setStatus(`Removed ${ip}:${port}.`);
      await loadAll();
    } catch (err) {
      setStatus(err.message, false);
    }
  }

  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;",
      '"': "&quot;", "'": "&#039;"
    }[c]));
  }

  loadAll();
</script>
</body>
</html>
